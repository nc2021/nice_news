<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nice News</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Nice News</h1>
        <p>Search for uplifting news stories.</p>
        <form id="search-form">
          <input
            type="text"
            id="query"
            name="q"
            placeholder="Try 'good news'"
            aria-label="Search query"
            required
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <section id="status" role="status" aria-live="polite"></section>

      <ul id="results" class="news-list"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
